<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProseMirror mark view selection repro</title>
<style>
  body { font: 16px/1.4 system-ui, sans-serif; margin: 16px; max-width: 720px; }
  h1 { font-size: 16px; }
  #editor { border: 1px solid #999; padding: 8px 12px; font-size: 22px; }
  .ProseMirror { outline: none; }
  .ProseMirror p { margin: 0 0 0.4em; }
  .mention .label { background: #d9e2f5; border-radius: 4px; padding: 0 6px; margin-right: 2px;}
  .mention .source { color: #999; font-size: 0.7em; }
  .mention { border: 1px solid rgba(0,200,0,0.4); padding: 5px; margin: 2px;}
  #log { font: 12px/1.35 ui-monospace, monospace; white-space: pre; overflow: auto; max-height: 200px;min-height: 200px; border: 1px solid #ccc; padding: 6px; margin-top: 8px; }
</style>
</head>
<body>
<h1>Mark view with <code>contenteditable=false</code></h1>
<div id="editor"></div>
<p><label><input type="checkbox" id="debug"> debug</label></p>
<div id="log"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
